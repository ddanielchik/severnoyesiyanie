services:
  postgres:
    image: postgres:17
    container_name: severnoyesiyanie-postgres

    environment:
      POSTGRES_DB: severnoyesiyanie
      POSTGRES_USER: severnoyesiyanie
      POSTGRES_PASSWORD: severnoyesiyanie

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U severnoyesiyanie -d severnoyesiyanie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: severnoyesiyanie-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/severnoyesiyanie
      SPRING_DATASOURCE_USERNAME: severnoyesiyanie
      SPRING_DATASOURCE_PASSWORD: severnoyesiyanie

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: